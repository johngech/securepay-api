spring:
  application:
    name: securepay
  datasource:
    url: jdbc:mysql://localhost:3306/securepay?createDatabaseIfNotExist=true
    username: root
    password: MyPassword!1234

  jpa:
    show-sql: true

  config:
    import: optional:file:.env[.properties]

  jwt:
    secretKey: ${JWT_SECRET}
    accessTokenExpiration: ${ACCESS_TOKEN_EXPIRATION} # 900 15 minutes
    refreshTokenExpiration: ${REFRESH_TOKEN_EXPIRATION} # 604800 7 days

stripe:
  secretKey: ${STRIPE_SECRET_KEY}
  webhookSecretKey: ${STRIPE_WEBHOOK_SECRET_KEY}


